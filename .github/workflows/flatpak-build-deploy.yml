name: Flatpak Build and Deploy

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  workflow_dispatch:  # allow manual trigger
  repository_dispatch:
    types: [release-event]

env:
  APP_ID: xyz.fontra.FontraPak
  RUNTIME_REPO: "https://flathub.org/repo/flathub.flatpakrepo"

jobs:
  update-release:
    name: Update to Latest FontraPak Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Get latest release info
        id: latest-release
        run: |
          RELEASE_DATA=$(curl -s https://api.github.com/repos/fontra/fontra-pak/releases/latest)
          VERSION=$(echo "$RELEASE_DATA" | jq -r .tag_name)
          ASSET_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name=="FontraPak-Ubuntu.tgz") | .browser_download_url')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT

      - name: Download and calculate SHA256
        id: calculate-sha
        run: |
          curl -L -o FontraPak-Ubuntu.tgz "${{ steps.latest-release.outputs.asset_url }}"
          SHA256=$(sha256sum FontraPak-Ubuntu.tgz | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          rm FontraPak-Ubuntu.tgz

      - name: Update manifest file
        run: |
          VERSION="${{ steps.latest-release.outputs.version }}"
          SHA256="${{ steps.calculate-sha.outputs.sha256 }}"
          sed -i "s|url: https://github.com/fontra/fontra-pak/releases/download/[^/]*/FontraPak-Ubuntu.tgz|url: https://github.com/fontra/fontra-pak/releases/download/${VERSION}/FontraPak-Ubuntu.tgz|" ${{ env.APP_ID }}.yml
          sed -i "s|sha256: .*|sha256: ${SHA256}|" ${{ env.APP_ID }}.yml

      - name: Update metainfo.xml with new release notes
        run: |
          export VERSION="${{ steps.latest-release.outputs.version }}"
          export VERSION_CLEAN=$(echo "$VERSION" | sed 's/^v//')
          export RELEASE_DATE=$(date +%Y-%m-%d)

          # Fetch raw body
          RAW_BODY=$(curl -s https://api.github.com/repos/fontra/fontra-pak/releases/latest | jq -r '.body')

          # Format Markdown to simple XML description tags
          export FORMATTED_NOTES=$(echo "$RAW_BODY" | awk '
            BEGIN { in_list = 0 }
            /^(###?|[A-Za-z]+:?)/ {
              if (in_list) { print "        </ul>"; in_list = 0 }
              gsub(/^(###? ?|\*\*|\*\*)/, "")
              print "        <p>" $0 "</p>"
              next
            }
            /^[-*]/ {
              if (!in_list) { print "        <ul>"; in_list = 1 }
              gsub(/^[-*] /, "")
              gsub(/&/, "&amp;")
              gsub(/</, "&lt;")
              gsub(/>/, "&gt;")
              gsub(/\[([^\]]+)\]\([^)]+\)/, "\\1")
              print "          <li>" $0 "</li>"
              next
            }
            END { if (in_list) print "        </ul>" }
          ')

          python3 -c '
          import os
          import xml.etree.ElementTree as ET

          file_path = f"{os.environ[\"APP_ID\"]}.metainfo.xml"
          version = os.environ["VERSION_CLEAN"]
          date = os.environ["RELEASE_DATE"]
          notes = os.environ.get("FORMATTED_NOTES", "")

          tree = ET.parse(file_path)
          root = tree.getroot()
          releases = root.find("releases")

          # Remove existing release entry with matching version to prevent duplicates
          for r in list(releases.findall("release")):
              if r.get("version") == version:
                  releases.remove(r)

          # Build new release element
          new_release = ET.Element("release", {"version": version, "date": date})
          desc = ET.Element("description")

          try:
              desc_tree = ET.fromstring(f"<root>{notes}</root>")
              for child in desc_tree:
                  desc.append(child)
          except Exception:
              p = ET.Element("p")
              p.text = f"Release {version}"
              desc.append(p)

          new_release.append(desc)
          releases.insert(0, new_release)

          ET.indent(tree, space="  ")
          tree.write(file_path, encoding="utf-8", xml_declaration=True)'


      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add ${{ env.APP_ID }}.yml ${{ env.APP_ID }}.metainfo.xml
          git commit -m "chore: update to FontraPak ${{ steps.latest-release.outputs.version }}"
          git push

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    needs: update-release
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: ${{ env.APP_ID }}.yml
          bundle: ${{ env.APP_ID }}.flatpak
          branch: ${{ github.ref_name }}
          gpg-sign: ${{ steps.import_gpg.outputs.keyid }}
          upload-artifact: true
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Generate repository summary
        run: |
          flatpak build-update-repo --gpg-sign=${{ steps.import_gpg.outputs.keyid }} --generate-static-deltas --prune repo/

      - name: Upload OSTree repository
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo
          path: repo/

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: flatpak
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download OSTree repository
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
          path: repo

      - name: Prepare files for GitHub Pages
        run: |
          mkdir -p public
          cp -r repo/* public/
          cp ${{ env.APP_ID }}.flatpakref public/ || true

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
